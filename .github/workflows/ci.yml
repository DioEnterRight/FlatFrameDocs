name: CI

# Regression and security checks. Read-only token, no secrets, nothing published: safe for pull requests from forks.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]
  pull_request:
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q --require-hashes -r requirements-dev.lock
      - name: Static check
        run: python -m pyflakes flatframe tools tests
      - name: Config + JSON files are valid
        run: |
          python -c "from flatframe.common import load_config; load_config(); print('config.yaml ok')"
          python -c "import json,glob; [json.load(open(p)) for p in glob.glob('data/*.json')+glob.glob('samples/*/*.json')]; print('json ok')"
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit (Python)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install from the lockfile (no install scripts)
        working-directory: engine
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: engine
        run: npx tsc --noEmit
      - name: Dependency audit (Node, production deps)
        working-directory: engine
        run: npm audit --omit=dev --audit-level=high
      - name: Bundle + render 3 stills of the demo plan (catches runtime errors in the engine)
        working-directory: engine
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/render.mjs src/demo-plan.json --stills 0,20,40 --outdir /tmp/stills && ls -la /tmp/stills

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read     # gitleaks lists a pull request's commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
