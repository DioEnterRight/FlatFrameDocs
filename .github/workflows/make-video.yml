name: Make video

# Hourly gate (UTC grid; flatframe/schedule.py thinks in India time) keeps `schedule.make_ahead` videos ready.
# The write token exists only in the Queue + Save steps; everything that runs third-party code (pip, npm, models,
# TTS, Chrome) runs without it. Pull requests never run this workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: no keys, nothing queued; renders the bundled sample documentary as an artifact"
        type: boolean
        default: true
      force:
        description: "Make one video even if the queue is full (never affects posting limits)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ffd-make
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      make: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.make == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: gate
        if: github.event_name != 'workflow_dispatch'
        env:
          HAS_KEYS: ${{ secrets.FREELLMAPI_KEYS != '' }}
        run: |
          if [ "$HAS_KEYS" != "true" ]; then
            echo "::notice::FREELLMAPI_KEYS is not set yet (python tools/add_tokens.py), so no scheduled video is made."
            echo "make=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pip install -q pyyaml==6.0.4 && python -m flatframe.gate make

  make:
    needs: gate
    if: needs.gate.outputs.make == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write          # Releases (the queue) + saving data/; used only by the Queue and Save steps
    env:
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache the fallback voice model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: kokoro-v1.0-int8-${{ hashFiles('kokoro.lock.json') }}

      - name: Install Python packages (hash-locked) + fallback voice
        run: |
          pip install -q --require-hashes -r requirements.lock
          python -m flatframe.fetch_models

      - name: Install the 2D engine (lockfile, no install scripts)
        working-directory: engine
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start FreeLLMAPI inside this job (free models only)
        if: env.TEST != 'true'
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: bash tools/start_freellmapi.sh

      - name: Make the documentary
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$TEST" = "true" ]; then
            python -m flatframe.produce --test
          else
            ARGS="--release"; if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
            python -m flatframe.produce $ARGS
          fi

      - name: Queue it (create the Release, record it)
        if: env.TEST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m flatframe.queue

      - name: Test video
        if: always() && env.TEST == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-documentary
          path: |
            out/*/final.mp4
            out/*/sheet.jpg
            out/*/storyboard.jpg
            out/*/qa.json
          retention-days: 7

      - name: Review pack (storyboards, research, scripts, QA, model usage)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-pack
          path: |
            out/*/*.json
            out/*/*.jpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Save memory (history, ideas, model usage)
        if: always() && env.TEST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/save_state.sh "bot: data $(date -u +%F)"
