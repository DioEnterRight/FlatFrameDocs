name: Post video

# Every 30 min: Instagram posts the slot that is due (never missed slots later), YouTube asks the safety controller
# (flatframe/yt_guard.py). The manual button posts the oldest ready video to Instagram now; it cannot force YouTube.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ffd-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # download releases, temporary media branch for Instagram, save data/
      issues: write            # pause / manual-post notices
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Anything to do? (idle runs stop here)
        id: gate
        run: |
          pip install -q pyyaml==6.0.4
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else python -m flatframe.gate post; fi

      - name: Install
        if: steps.gate.outputs.due == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --require-hashes -r requirements.lock

      - name: Post (Instagram slot + guarded YouTube)
        if: steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m flatframe.publish ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}

      - name: Save memory
        if: always() && steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/save_state.sh "bot: posted $(date -u +%F)"
