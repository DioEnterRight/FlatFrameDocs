# Weekly update PRs for pinned dependencies. CI must pass before merging; nothing auto-merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/engine"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      remotion: {patterns: ["remotion", "@remotion/*"]}
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
